command:
  - python
  - -m
  - uvicorn
  - coco.app.main:app
  - --app-dir
  - src
  - --host
  - 0.0.0.0
  - --port
  - "8000"

env:
  - name: COCO_CONFIG_PATH
    value: config/default.yaml
  - name: COCO_WAREHOUSE_ID
    valueFrom: warehouse_id
  - name: COCO_AGENT_ENDPOINT_URL
    valueFrom: agent_endpoint_url
  # Namespace-aware catalog and schema so multiple users in the same
  # workspace don't collide on table names. These are set by the
  # bundle variables (databricks.yml) which include the unique_id.
  - name: COCO_CATALOG_NAME
    value: coco_demo
  - name: COCO_SCHEMA_NAME
    value: cohort_builder

# Scopes for the user OBO flow. When a user opens the App, the Apps
# platform forwards their identity to the App via x-forwarded-access-token.
# Listing these scopes tells the platform to mint a downscoped user
# token that the App can pass through to the agent endpoint. The
# agent then calls SQL warehouse APIs as the requesting user, who
# has the databricks-sql-access entitlement that the platform's
# managed serving SP lacks. Lakebase is intentionally NOT in this
# list because it does not support OBO; the App SP connects to
# Lakebase via the typed `postgres` resource binding instead.
user_api_scopes:
  - sql
  - serving.serving-endpoints
  - unity-catalog
