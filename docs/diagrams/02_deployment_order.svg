<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1100" viewBox="0 0 1480 1100" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#1b1b1f" />
</marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff" />
<text x="740" y="50" font-size="28" fill="#1b1b1f" text-anchor="middle" font-weight="600"><tspan x="740" dy="0">CoCo deployment order</tspan></text>
<text x="740" y="82" font-size="14" fill="#444" text-anchor="middle"><tspan x="740" dy="0">Each step depends on the ones above it. The setup_workspace job automates the full sequence.</tspan></text>
<rect x="60" y="120" width="1100" height="121" rx="10" ry="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2" />
<text x="80" y="150" font-size="16" fill="#1971c2" text-anchor="start" font-weight="600"><tspan x="80" dy="0">Step 1.  Unity Catalog catalog + schema</tspan></text>
<text x="80" y="176" font-size="12" fill="#333" text-anchor="start"><tspan x="80" dy="0">CREATE SCHEMA &lt;catalog&gt;.&lt;schema&gt;. Volumes for knowledge corpus and artifacts.</tspan><tspan x="80" dy="1.25em">Everything else lives in here.</tspan><tspan x="80" dy="1.25em">If this fails: you lack CREATE SCHEMA grant on the catalog. Ask a UC admin.</tspan></text>
<line x1="610" y1="241" x2="610" y2="263" stroke="#1b1b1f" stroke-width="2" marker-end="url(#arrow)" />
<rect x="60" y="265" width="1100" height="121" rx="10" ry="10" fill="#fff4e6" stroke="#e67700" stroke-width="2" />
<text x="80" y="295" font-size="16" fill="#e67700" text-anchor="start" font-weight="600"><tspan x="80" dy="0">Step 2.  Data tables</tspan></text>
<text x="80" y="321" font-size="12" fill="#333" text-anchor="start"><tspan x="80" dy="0">Mode = synthetic: the data_generator builds patients/diagnoses/etc with Faker (healthcare only).</tspan><tspan x="80" dy="1.25em">Mode = existing_uc_schema: you load your own tables into the schema before this step.</tspan><tspan x="80" dy="1.25em">See FORK_GUIDE for the BYO-data path.</tspan></text>
<line x1="610" y1="386" x2="610" y2="408" stroke="#1b1b1f" stroke-width="2" marker-end="url(#arrow)" />
<rect x="60" y="410" width="1100" height="121" rx="10" ry="10" fill="#fff4e6" stroke="#e67700" stroke-width="2" />
<text x="80" y="440" font-size="16" fill="#e67700" text-anchor="start" font-weight="600"><tspan x="80" dy="0">Step 3.  Knowledge corpus drop into UC Volume</tspan></text>
<text x="80" y="466" font-size="12" fill="#333" text-anchor="start"><tspan x="80" dy="0">Your reference docs go in /Volumes/&lt;catalog&gt;/&lt;schema&gt;/&lt;corpus&gt;/.</tspan><tspan x="80" dy="1.25em">Setup chunks them and writes to the AI Search index.</tspan><tspan x="80" dy="1.25em">Domain spec field: knowledge.source_volume_path</tspan></text>
<line x1="610" y1="531" x2="610" y2="553" stroke="#1b1b1f" stroke-width="2" marker-end="url(#arrow)" />
<rect x="60" y="555" width="1100" height="121" rx="10" ry="10" fill="#fff9db" stroke="#e67700" stroke-width="2" />
<text x="80" y="585" font-size="16" fill="#e67700" text-anchor="start" font-weight="600"><tspan x="80" dy="0">Step 4.  Vector Search endpoint + hybrid index</tspan></text>
<text x="80" y="611" font-size="12" fill="#333" text-anchor="start"><tspan x="80" dy="0">Endpoint creation can take ~10 minutes on a cold workspace.</tspan><tspan x="80" dy="1.25em">Index reads from the chunked corpus table.</tspan><tspan x="80" dy="1.25em">Domain spec field: ontology.source.index_name</tspan></text>
<line x1="610" y1="676" x2="610" y2="698" stroke="#1b1b1f" stroke-width="2" marker-end="url(#arrow)" />
<rect x="60" y="700" width="1100" height="121" rx="10" ry="10" fill="#fff9db" stroke="#e67700" stroke-width="2" />
<text x="80" y="730" font-size="16" fill="#e67700" text-anchor="start" font-weight="600"><tspan x="80" dy="0">Step 5.  Lakebase instance + database (optional)</tspan></text>
<text x="80" y="756" font-size="12" fill="#333" text-anchor="start"><tspan x="80" dy="0">Postgres-backed chat thread store.</tspan><tspan x="80" dy="1.25em">Skip with --var minimal=true; sessions then live in memory.</tspan><tspan x="80" dy="1.25em">Lakebase does not support OBO; the App SP connects via the postgres resource binding.</tspan></text>
<line x1="610" y1="821" x2="610" y2="843" stroke="#1b1b1f" stroke-width="2" marker-end="url(#arrow)" />
<rect x="60" y="845" width="1100" height="121" rx="10" ry="10" fill="#fff9db" stroke="#e67700" stroke-width="2" />
<text x="80" y="875" font-size="16" fill="#e67700" text-anchor="start" font-weight="600"><tspan x="80" dy="0">Step 6.  Agent on Model Serving</tspan></text>
<text x="80" y="901" font-size="12" fill="#333" text-anchor="start"><tspan x="80" dy="0">log_model with AuthPolicy (SystemAuthPolicy for SP grants, UserAuthPolicy for OBO scopes).</tspan><tspan x="80" dy="1.25em">Register the model in UC and call agents.deploy.</tspan><tspan x="80" dy="1.25em">If this fails: warehouse CAN_USE missing or unity-catalog scope conflict.</tspan></text>
<line x1="610" y1="966" x2="610" y2="988" stroke="#1b1b1f" stroke-width="2" marker-end="url(#arrow)" />
<rect x="60" y="990" width="1100" height="103" rx="10" ry="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2" />
<text x="80" y="1020" font-size="16" fill="#1971c2" text-anchor="start" font-weight="600"><tspan x="80" dy="0">Step 7.  Databricks App</tspan></text>
<text x="80" y="1046" font-size="12" fill="#333" text-anchor="start"><tspan x="80" dy="0">FastAPI frontend bound to warehouse + agent endpoint + Lakebase via typed AppResource bindings.</tspan><tspan x="80" dy="1.25em">user_api_scopes: sql, serving.serving-endpoints so the App can forward an OBO token to the agent.</tspan></text>
<rect x="1200" y="280" width="250" height="600" rx="10" ry="10" fill="#f8f9fa" stroke="#666" stroke-width="2" />
<text x="1325" y="320" font-size="16" fill="#444" text-anchor="middle" font-weight="600"><tspan x="1325" dy="0">Domain spec</tspan></text>
<text x="1325" y="350" font-size="12" fill="#444" text-anchor="middle"><tspan x="1325" dy="0">domains/&lt;name&gt;/domain.yaml</tspan></text>
<text x="1325" y="410" font-size="12" fill="#333" text-anchor="middle"><tspan x="1325" dy="0">This one file drives:</tspan><tspan x="1325" dy="1.25em">+ Step 2 table names</tspan><tspan x="1325" dy="1.25em">+ Step 3 corpus path</tspan><tspan x="1325" dy="1.25em">+ Step 4 index name</tspan><tspan x="1325" dy="1.25em">+ Step 6 agent prompt + tools</tspan><tspan x="1325" dy="1.25em">+ Step 6 SQL guardrails</tspan></text>
<text x="1325" y="620" font-size="12" fill="#444" text-anchor="middle" font-weight="600"><tspan x="1325" dy="0">Bundle var:</tspan></text>
<text x="1325" y="644" font-size="12" fill="#333" text-anchor="middle"><tspan x="1325" dy="0">--var domain=&lt;name&gt;</tspan></text>
<text x="1325" y="700" font-size="12" fill="#2f9e44" text-anchor="middle" font-weight="600"><tspan x="1325" dy="0">Fork? Change here only.</tspan></text>
</svg>
