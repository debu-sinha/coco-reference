<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1020" viewBox="0 0 1400 1020" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#1b1b1f" />
</marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff" />
<text x="700" y="50" font-size="28" fill="#1b1b1f" text-anchor="middle" font-weight="600"><tspan x="700" dy="0">CoCo end-to-end architecture</tspan></text>
<text x="700" y="82" font-size="14" fill="#444" text-anchor="middle"><tspan x="700" dy="0">What runs, what calls what, when a user asks a question in the chat UI</tspan></text>
<rect x="550" y="120" width="300" height="60" rx="10" ry="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2" />
<text x="700" y="156" font-size="18" fill="#1971c2" text-anchor="middle" font-weight="600"><tspan x="700" dy="0">User browser</tspan></text>
<line x1="700" y1="180" x2="700" y2="220" stroke="#1b1b1f" stroke-width="2" marker-end="url(#arrow)" />
<rect x="450" y="230" width="500" height="90" rx="10" ry="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2" />
<text x="700" y="260" font-size="17" fill="#1971c2" text-anchor="middle" font-weight="600"><tspan x="700" dy="0">Databricks App</tspan></text>
<text x="700" y="285" font-size="12" fill="#1971c2" text-anchor="middle"><tspan x="700" dy="0">FastAPI + HTMX + SSE</tspan><tspan x="700" dy="1.25em">Forwards user OBO token via X-Forwarded-Access-Token</tspan></text>
<line x1="700" y1="320" x2="700" y2="360" stroke="#1b1b1f" stroke-width="2" marker-end="url(#arrow)" />
<rect x="60" y="370" width="880" height="200" rx="10" ry="10" fill="#fff9db" stroke="#e67700" stroke-width="2" />
<text x="500" y="402" font-size="17" fill="#e67700" text-anchor="middle" font-weight="600"><tspan x="500" dy="0">Agent serving endpoint</tspan></text>
<text x="500" y="430" font-size="13" fill="#444" text-anchor="middle"><tspan x="500" dy="0">MLflow ResponsesAgent wraps a DSPy ReAct loop (max 7 iterations)</tspan><tspan x="500" dy="1.25em">User identity via ModelServingUserCredentials (sql, serving.serving-endpoints)</tspan><tspan x="500" dy="1.25em">System SP via DatabricksTable + DatabricksSQLWarehouse + DatabricksServingEndpoint</tspan><tspan x="500" dy="1.25em">Reads active domain spec from coco_domain artifact at load_context</tspan></text>
<rect x="970" y="370" width="370" height="200" rx="10" ry="10" fill="#e5dbff" stroke="#6741d9" stroke-width="2" />
<text x="1155" y="402" font-size="17" fill="#6741d9" text-anchor="middle" font-weight="600"><tspan x="1155" dy="0">Observability</tspan></text>
<text x="1155" y="430" font-size="13" fill="#444" text-anchor="middle"><tspan x="1155" dy="0">MLflow Traces (auto + manual spans)</tspan><tspan x="1155" dy="1.25em">judge.align with SIMBA default optimizer</tspan><tspan x="1155" dy="1.25em">Prompt Registry, versioned in UC</tspan><tspan x="1155" dy="1.25em">4-layer cost attribution dashboard</tspan></text>
<line x1="940" y1="470" x2="970" y2="470" stroke="#1b1b1f" stroke-width="2" marker-end="url(#arrow)" />
<line x1="220" y1="570" x2="220" y2="610" stroke="#1b1b1f" stroke-width="2" marker-end="url(#arrow)" />
<line x1="500" y1="570" x2="500" y2="610" stroke="#1b1b1f" stroke-width="2" marker-end="url(#arrow)" />
<line x1="780" y1="570" x2="780" y2="610" stroke="#1b1b1f" stroke-width="2" marker-end="url(#arrow)" />
<rect x="80" y="610" width="280" height="70" rx="10" ry="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2" />
<text x="220" y="640" font-size="14" fill="#2f9e44" text-anchor="middle" font-weight="600"><tspan x="220" dy="0">Domain entity lookup</tspan></text>
<text x="220" y="662" font-size="11" fill="#444" text-anchor="middle"><tspan x="220" dy="0">from domain.yaml ontology source</tspan></text>
<rect x="380" y="610" width="240" height="70" rx="10" ry="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2" />
<text x="500" y="640" font-size="14" fill="#2f9e44" text-anchor="middle" font-weight="600"><tspan x="500" dy="0">generate_sql</tspan></text>
<text x="500" y="662" font-size="11" fill="#444" text-anchor="middle"><tspan x="500" dy="0">uses domain.sql_guardrails</tspan></text>
<rect x="640" y="610" width="280" height="70" rx="10" ry="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2" />
<text x="780" y="640" font-size="14" fill="#2f9e44" text-anchor="middle" font-weight="600"><tspan x="780" dy="0">execute_sql</tspan></text>
<text x="780" y="662" font-size="11" fill="#444" text-anchor="middle"><tspan x="780" dy="0">via user OBO sql scope</tspan></text>
<line x1="220" y1="680" x2="200" y2="740" stroke="#1b1b1f" stroke-width="2" marker-end="url(#arrow)" />
<line x1="500" y1="680" x2="540" y2="740" stroke="#1b1b1f" stroke-width="2" marker-end="url(#arrow)" />
<line x1="780" y1="680" x2="880" y2="740" stroke="#1b1b1f" stroke-width="2" marker-end="url(#arrow)" />
<line x1="780" y1="680" x2="1210" y2="740" stroke="#1b1b1f" stroke-width="2" marker-end="url(#arrow)" />
<rect x="40" y="740" width="320" height="220" rx="10" ry="10" fill="#fff4e6" stroke="#e67700" stroke-width="2" />
<text x="200" y="770" font-size="15" fill="#e67700" text-anchor="middle" font-weight="600"><tspan x="200" dy="0">LLM access</tspan></text>
<text x="200" y="800" font-size="12" fill="#444" text-anchor="middle"><tspan x="200" dy="0">Foundation Model APIs</tspan><tspan x="200" dy="1.25em">Unity AI Gateway</tspan><tspan x="200" dy="1.25em">(PII filter, rate limit,</tspan><tspan x="200" dy="1.25em">fallback model on 5xx)</tspan><tspan x="200" dy="1.25em">Claude Sonnet 4.x</tspan></text>
<rect x="380" y="740" width="340" height="220" rx="10" ry="10" fill="#fff4e6" stroke="#e67700" stroke-width="2" />
<text x="550" y="770" font-size="15" fill="#e67700" text-anchor="middle" font-weight="600"><tspan x="550" dy="0">Knowledge + ontology</tspan></text>
<text x="550" y="800" font-size="12" fill="#444" text-anchor="middle"><tspan x="550" dy="0">AI Search hybrid index</tspan><tspan x="550" dy="1.25em">(semantic + keyword BM25)</tspan><tspan x="550" dy="1.25em">built from UC Volume corpus at</tspan><tspan x="550" dy="1.25em">domain.knowledge.source_volume_path</tspan></text>
<rect x="740" y="740" width="340" height="220" rx="10" ry="10" fill="#fff4e6" stroke="#e67700" stroke-width="2" />
<text x="910" y="770" font-size="15" fill="#e67700" text-anchor="middle" font-weight="600"><tspan x="910" dy="0">Data + state</tspan></text>
<text x="910" y="800" font-size="12" fill="#444" text-anchor="middle"><tspan x="910" dy="0">Unity Catalog tables</tspan><tspan x="910" dy="1.25em">(domain.data.tables)</tspan><tspan x="910" dy="1.25em">SQL Warehouse for execute_sql</tspan><tspan x="910" dy="1.25em">Lakebase for session threads</tspan><tspan x="910" dy="1.25em">(SP-only, OBO not supported)</tspan></text>
<rect x="1100" y="740" width="280" height="220" rx="10" ry="10" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2" />
<text x="1240" y="770" font-size="15" fill="#c92a2a" text-anchor="middle" font-weight="600"><tspan x="1240" dy="0">Deploy + cost</tspan></text>
<text x="1240" y="800" font-size="12" fill="#444" text-anchor="middle"><tspan x="1240" dy="0">Declarative Automation Bundles</tspan><tspan x="1240" dy="1.25em">per-user unique_id namespacing</tspan><tspan x="1240" dy="1.25em">4-layer cost attribution</tspan><tspan x="1240" dy="1.25em">MLflow registered model</tspan><tspan x="1240" dy="1.25em">in Unity Catalog</tspan></text>
</svg>
